<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Example</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .footer {
      background: #0f172a;
      color: #fff;
      padding: 40px 0 0;
    }

    .footer-container {
      width: 90%;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .footer-section h2,
    .footer-section h3 {
      margin-bottom: 15px;
    }

    .footer-section p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .footer-section ul {
      list-style: none;
      padding: 0;
    }

    .footer-section ul li {
      margin: 8px 0;
    }

    .footer-section ul li a {
      color: #cbd5e1;
      text-decoration: none;
      transition: 0.3s;
    }

    .footer-section ul li a:hover {
      color: #4CAF50;
    }

    .footer-bottom {
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
      background: #020617;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- FOOTER START -->
  <footer class="footer">
    <div class="footer-container">
      
      <!-- About Section -->
      <div class="footer-section">
        <h2>MyWebsite</h2>
        <p>Your one-stop solution for learning and building amazing projects.</p>
      </div>

      <!-- Quick Links -->
      <div class="footer-section">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>

      <!-- Contact Info -->
      <div class="footer-section">
        <h3>Contact</h3>
        <p>Email: info@example.com</p>
        <p>Phone: +91 12345 67890</p>
      </div>

    </div>

    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p>© 2026 MyWebsite | All Rights Reserved</p>
    </div>
  </footer>
  <!-- FOOTER END -->

</body>
</html>
